name: release farai data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pajarori/farai
          path: farai-source
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install farai source
        run: bun install --frozen-lockfile --cwd farai-source
      - name: choose release version
        id: version
        run: echo "version=$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: build artifacts
        env:
          FARAI_SOURCE_DIR: ${{ github.workspace }}/farai-source
        run: ./scripts/build-release.sh "${{ steps.version.outputs.version }}"
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.version }}"
          assets=(dist/manifest.json dist/knowledge.db dist/skills.tar.gz dist/checksums.txt)
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" "${assets[@]}" --title "${tag}" --notes "farai data ${tag}"
          fi
